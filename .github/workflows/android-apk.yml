name: Compila Drone Italia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verifica JavaScript incorporato
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.I | re.S)
          scripts = [script for script in scripts if script.strip()]
          assert scripts, 'Nessuno script incorporato trovato'
          for i, script in enumerate(scripts):
              Path(f'/tmp/drone-italia-script-{i}.js').write_text(script, encoding='utf-8')
          print(f'Script JavaScript trovati: {len(scripts)}')
          PY
          for file in /tmp/drone-italia-script-*.js; do node --check "$file"; done

      - name: Prepara firma permanente (se configurata)
        env:
          DRONE_KEYSTORE_BASE64: ${{ secrets.DRONE_KEYSTORE_BASE64 }}
          DRONE_SIGNING_STORE_PASSWORD: ${{ secrets.DRONE_SIGNING_STORE_PASSWORD }}
          DRONE_SIGNING_KEY_ALIAS: ${{ secrets.DRONE_SIGNING_KEY_ALIAS }}
          DRONE_SIGNING_KEY_PASSWORD: ${{ secrets.DRONE_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$DRONE_KEYSTORE_BASE64" ]; then
            : "${DRONE_SIGNING_STORE_PASSWORD:?Password keystore mancante}"
            : "${DRONE_SIGNING_KEY_ALIAS:?Alias chiave mancante}"
            : "${DRONE_SIGNING_KEY_PASSWORD:?Password chiave mancante}"
            printf '%s' "$DRONE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/drone-italia.jks"
            keytool -list -keystore "$RUNNER_TEMP/drone-italia.jks" -storepass "$DRONE_SIGNING_STORE_PASSWORD" -alias "$DRONE_SIGNING_KEY_ALIAS" > /dev/null
            echo "DRONE_SIGNING_STORE_FILE=$RUNNER_TEMP/drone-italia.jks" >> "$GITHUB_ENV"
            echo "Firma permanente configurata."
          else
            echo "::error::Chiave di firma permanente mancante: compilazione interrotta per evitare APK incompatibili."
            exit 1
          fi

      - name: Compila APK
        env:
          DRONE_SIGNING_STORE_PASSWORD: ${{ secrets.DRONE_SIGNING_STORE_PASSWORD }}
          DRONE_SIGNING_KEY_ALIAS: ${{ secrets.DRONE_SIGNING_KEY_ALIAS }}
          DRONE_SIGNING_KEY_PASSWORD: ${{ secrets.DRONE_SIGNING_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: Drone-Italia-APK
          path: app/build/outputs/apk/debug/*.apk

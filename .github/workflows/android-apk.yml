name: Compila Drone Italia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verifica JavaScript incorporato
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.I | re.S)
          scripts = [script for script in scripts if script.strip()]
          assert scripts, 'Nessuno script incorporato trovato'
          for i, script in enumerate(scripts):
              Path(f'/tmp/drone-italia-script-{i}.js').write_text(script, encoding='utf-8')
          print(f'Script JavaScript trovati: {len(scripts)}')
          PY
          for file in /tmp/drone-italia-script-*.js; do node --check "$file"; done

      - name: Compila APK
        run: gradle assembleDebug --stacktrace

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: Drone-Italia-APK
          path: app/build/outputs/apk/debug/*.apk

name: APK Android di prova

on:
  workflow_dispatch:
  push:
    branches:
      - ui/home-dashboard-compatta
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-test-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verifica Android SDK preinstallato
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Configura firma persistente e versione
        env:
          DRONE_KEYSTORE_BASE64: ${{ secrets.DRONE_KEYSTORE_BASE64 }}
          DRONE_SIGNING_STORE_PASSWORD: ${{ secrets.DRONE_SIGNING_STORE_PASSWORD }}
          DRONE_SIGNING_KEY_ALIAS: ${{ secrets.DRONE_SIGNING_KEY_ALIAS }}
          DRONE_SIGNING_KEY_PASSWORD: ${{ secrets.DRONE_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$DRONE_KEYSTORE_BASE64" ] || [ -z "$DRONE_SIGNING_STORE_PASSWORD" ] || [ -z "$DRONE_SIGNING_KEY_ALIAS" ] || [ -z "$DRONE_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Firma permanente non configurata. Impostare i quattro GitHub Actions Secrets prima di compilare altri APK."
            exit 1
          fi
          echo "$DRONE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/drone-italia-signing.jks"
          echo "DRONE_SIGNING_STORE_FILE=$RUNNER_TEMP/drone-italia-signing.jks" >> "$GITHUB_ENV"
          echo "DRONE_CI_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Compila APK debug firmato
        run: gradle --no-daemon :app:assembleDebug
      - name: Pubblica APK di prova
        uses: actions/upload-artifact@v4
        with:
          name: Drone-Italia-Dashboard-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

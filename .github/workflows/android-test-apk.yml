name: APK Android di prova

on:
  workflow_dispatch:
  push:
    branches:
      - ui/home-dashboard-compatta
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-test-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compila APK debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Pubblica APK di prova
        uses: actions/upload-artifact@v4
        with:
          name: Drone-Italia-Dashboard-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

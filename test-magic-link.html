<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drone Italia — Test Magic Link</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><style>body{font:16px system-ui;background:#eef5fa;color:#18374d;max-width:560px;margin:48px auto;padding:20px}main{background:white;padding:24px;border-radius:16px}input,button{font:inherit;padding:12px;margin:10px 0;width:100%;box-sizing:border-box}button{background:#1265bc;color:white;border:0;border-radius:8px}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:#11673d}</style></head><body><main><h1>Drone Italia — Test Magic Link</h1><p>Pagina temporanea di prova, separata dal sito definitivo.</p><label for="email">La tua email</label><input id="email" type="email" autocomplete="email" required><div id="captcha"></div><button id="send" disabled>Invia link di verifica</button><p id="status" role="status">In attesa della verifica antispam.</p><button id="check" type="button" hidden>Verifica sessione</button><button id="logout" type="button" hidden>Esci dalla sessione</button></main><script>
const API='https://drone-italia-commenti.turni-vigilanza-pdura.workers.dev',STORE='drone_italia_test_session';
const status=document.getElementById('status'),send=document.getElementById('send'),check=document.getElementById('check'),logout=document.getElementById('logout');
let captchaToken='',widget=null;
function getSession(){try{return sessionStorage.getItem(STORE)||''}catch{return ''}}
function setSession(t){try{sessionStorage.setItem(STORE,t)}catch{}}
function clearSession(){try{sessionStorage.removeItem(STORE)}catch{}}
async function verifySession(){const t=getSession();if(!/^[a-f0-9]{64}$/i.test(t)){status.textContent='Nessuna sessione attiva.';check.hidden=true;logout.hidden=true;return}try{const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+t}}),d=await r.json();if(r.ok&&d.authenticated===true){status.textContent='Email verificata! Sessione attiva.';status.className='ok';check.hidden=false;logout.hidden=false}else{clearSession();status.textContent='Sessione non valida o scaduta.';check.hidden=true;logout.hidden=true}}catch{status.textContent='Impossibile controllare la sessione: riprova.'}}
const fragment=new URLSearchParams(location.hash.replace(/^#/,''));const returned=fragment.get('di_session');
if(returned!==null){history.replaceState(null,'',location.pathname+location.search);if(/^[a-f0-9]{64}$/i.test(returned)){setSession(returned);verifySession()}else status.textContent='Collegamento di accesso non valido.'}else if(getSession())verifySession();
function initCaptcha(){if(window.turnstile){widget=turnstile.render('#captcha',{sitekey:'0x4AAAAAAFer0yfjcFi4Xgqu',callback:t=>{captchaToken=t;send.disabled=false},'expired-callback':()=>{captchaToken='';send.disabled=true},'error-callback':()=>{status.textContent='Verifica antispam non disponibile.'}})}else setTimeout(initCaptcha,200)}initCaptcha();
send.onclick=async()=>{const email=document.getElementById('email');if(!email.reportValidity()||!captchaToken)return;send.disabled=true;status.className='';status.textContent='Richiesta in corso...';try{const r=await fetch(API+'/auth/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),turnstileToken:captchaToken})});const d=await r.json();status.textContent=r.ok&&d.ok===true?'Richiesta accettata. Controlla la posta, anche Spam.':('Servizio: '+(d.error||'Errore '+r.status))}catch{status.textContent='Impossibile raggiungere il Worker.'}finally{captchaToken='';if(widget!==null&&window.turnstile)turnstile.reset(widget)}};
check.onclick=verifySession;
logout.onclick=async()=>{const t=getSession();clearSession();check.hidden=true;logout.hidden=true;status.className='';status.textContent='Sessione locale chiusa.';if(t)try{await fetch(API+'/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+t}})}catch{}};
</script></body></html>

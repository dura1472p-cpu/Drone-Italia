<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drone Italia — Prova Magic Link</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><style>body{font:16px system-ui;background:#eef5fa;color:#18374d;max-width:560px;margin:48px auto;padding:20px}main{background:white;padding:24px;border-radius:16px}input,button{font:inherit;padding:12px;margin:10px 0;width:100%;box-sizing:border-box}button{background:#1265bc;color:white;border:0;border-radius:8px}button:disabled{opacity:.5}#status{white-space:pre-wrap}</style></head><body><main><h1>Drone Italia — Prova Magic Link</h1><p>Pagina temporanea di test. Non è il sito definitivo. Inserisci la tua email, completa il controllo antispam e richiedi il link.</p><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><div id="captcha"></div><button id="send" disabled>Invia link di verifica</button><p id="status" role="status"></p></main><script>
const API='https://drone-italia-commenti.turni-vigilanza-pdura.workers.dev';let token='';let widget=null;
const status=document.getElementById('status'),send=document.getElementById('send');
function ready(){if(window.turnstile){widget=turnstile.render('#captcha',{sitekey:'0x4AAAAAAFer0yfjcFi4Xgqu',callback:t=>{token=t;send.disabled=false},'expired-callback':()=>{token='';send.disabled=true},'error-callback':()=>{status.textContent='Controllo antispam non disponibile'}})}else setTimeout(ready,200)}ready();
send.onclick=async()=>{const email=document.getElementById('email');if(!email.reportValidity()||!token)return;send.disabled=true;status.textContent='Richiesta in corso...';try{const r=await fetch(API+'/auth/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),turnstileToken:token})});const d=await r.json();status.textContent=r.ok?'Richiesta inviata. Controlla la posta, anche Spam.':('Risposta del servizio: '+(d.error||'Errore '+r.status));}catch(e){status.textContent='Connessione al servizio non riuscita.'}finally{token='';if(widget!==null&&window.turnstile)turnstile.reset(widget)}};</script></body></html>

plugins { id 'com.android.application' }
android { namespace 'it.paolodurante.droneitalia'; compileSdk 36
 defaultConfig { applicationId 'it.paolodurante.droneitalia.diagnostic'; minSdk 26; targetSdk 36; versionCode (System.getenv('DRONE_CI_BUILD_NUMBER') ? 1000 + Integer.parseInt(System.getenv('DRONE_CI_BUILD_NUMBER')) : 4); versionName '0.4-diagnostic' }
 signingConfigs {
  if (System.getenv('DRONE_SIGNING_STORE_FILE')) {
   permanent {
    storeFile file(System.getenv('DRONE_SIGNING_STORE_FILE'))
    storePassword System.getenv('DRONE_SIGNING_STORE_PASSWORD')
    keyAlias System.getenv('DRONE_SIGNING_KEY_ALIAS')
    keyPassword System.getenv('DRONE_SIGNING_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug {
   // Diagnostic app uses a distinct package; ephemeral debug signing is safe here.
  }
 }
 applicationVariants.all { variant ->
  variant.outputs.all { output ->
   output.outputFileName = "Drone-Italia-v${variant.versionName}.apk"
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

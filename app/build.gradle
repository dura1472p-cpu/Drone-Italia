plugins { id 'com.android.application' }
android { namespace 'it.paolodurante.droneitalia'; compileSdk 36
 defaultConfig { applicationId 'it.paolodurante.droneitalia'; minSdk 26; targetSdk 36; versionCode 4; versionName '0.4' }
 signingConfigs {
  if (System.getenv('DRONE_SIGNING_STORE_FILE')) {
   permanent {
    storeFile file(System.getenv('DRONE_SIGNING_STORE_FILE'))
    storePassword System.getenv('DRONE_SIGNING_STORE_PASSWORD')
    keyAlias System.getenv('DRONE_SIGNING_KEY_ALIAS')
    keyPassword System.getenv('DRONE_SIGNING_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug {
   if (System.getenv('DRONE_SIGNING_STORE_FILE')) signingConfig signingConfigs.permanent
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
